name: aladdin-daily

# 血统：总纲 ce5f09bf 七节「GitHub 信息系统运作 v1」（2026-11-20 掌舵人钦定·12h 档）
# 数据湖采集农场 + 引擎入库点火，合体一线：
#   job1 harvest = checkout 私仓跑 harvest.mjs → metrics commit 回仓
#     （FRED/CFTC 等被 CDN 屏蔽数据中心 IP 的源 Actions 侧 0 点属正常，CF 引擎管道兜底）
#   job2 ingest  = 引擎 23 源逐源点火（per-source 独立 invocation·批次5架构改造血统）
# 无新数据不虚账：harvest 无新点则不产生 commit
# 2026-11-21 加 push 心跳扳机：fork 仓 dispatch 422（UI-only enablement 层）绕行——
#   push .github/heartbeat.json → 只跑 ingest（快验）；schedule/dispatch → 全量
# 2026-11-22 行读纪律立法（限额案二次发作·D1 免费层 5M 行/天=账户级共享）：
#   心跳快验改单源 coingecko（~千行 vs 18 源全量 ~5-8 万行）；schedule/dispatch 保持 18 源全量不动
#   采集质量数量红线：per-source 独立 invocation 结构与 18 源清单永不因省行读而裁剪

on:
  schedule:
    - cron: '0 0,12 * * *'   # UTC 00/12 = 北京 08:00 / 20:00
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/heartbeat.json'

jobs:
  harvest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout data lake (private)
        uses: actions/checkout@v4
        with:
          repository: gonghailink/aladdin-data
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: harvest
        run: node harvest.mjs
      - name: commit metrics
        run: |
          git config user.name "aladdin-harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no new points (宁缺毋滥)" || {
            git commit -qm "harvest $(date -u +%FT%TZ) (actions ignition)"
            git push
          }

  ingest:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: engine per-source ignition (23 sources / heartbeat=1)
        env:
          ALADDIN_TOKEN: ${{ secrets.ALADDIN_TOKEN }}
        run: |
          BASE="https://aladdin.333200.xyz"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          FAIL=0
          SRCS="fred sec cftc wb frx safe ndrc caam eastmoney tic gov_policy scfi coingecko fao stats rbi nbim eurostat pboc shfe lme mot_port caac"
          if [ "${{ github.event_name }}" = "push" ]; then SRCS="coingecko"; fi
          for src in $SRCS; do
            echo "==> $src"
            RESP=$(curl -sS -m 150 -H "Authorization: Bearer $ALADDIN_TOKEN" -H "User-Agent: $UA" "$BASE/ingest?source=$src" | head -c 300) || FAIL=1
            echo "$RESP"
            sleep 3
          done
          echo "done (fail_flag=$FAIL)"
